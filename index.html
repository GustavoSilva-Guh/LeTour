<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Tour Femmes - Classificação</title>
    <style>
        /*Aqui vem o css */
        * {
            box-sizing: border-box;
        }
 
        html {
            scroll-behavior: smooth;
        }
 
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            background-color: #f7f8f1;
        }
 
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 90px;
            background-color: #26311a;
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            transition: height 0.4s;
            z-index: 10px;
        }
 
        nav.pequena {
            height: 55px;
        }
 
        nav a {
            color: #FFF;
            text-decoration: none;
            margin-left: 20px;
        }
 
        nav .logo {
            font-weight: bold;
            color: #c8e477;
        }
 
        .hero {
            height: 100vh;
            background: linear-gradient(135deg, #d6e692, #FFF);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }
 
        header h1 {
            font-size: clamp(36px, 7vw, 80px);
        }
 
        header p {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <nav id ="navbar">
        <div class="logo">LE TOUR FEMMES</div>
 
 
        <div>
            <a href="#classificaçao">Classificação</a>
            <a href="#graficos">Gráficos</a>
        </div>
    </nav>
    <header class="hero">
 
        <div>
            <h1>General Classification</h1>
            <p>Classificação após a etapa 6</p>
            <a href="classificaçao">Ver Classificação</a>
        </div>
    </header>
 
    <main>
 
    </main>
    <script>
        /*Aqui vem o nosso jss */
        const navbar = document.getElementById("navbar");
 
        window.addEventListener("scroll", function() {
            if(window.scrollY > 50) {
                navbar.classList.add("barra mais pequena");
            } else {
                navbar.classList.remove("pequena");
            }
        });
    </script>
</body>
</html>
